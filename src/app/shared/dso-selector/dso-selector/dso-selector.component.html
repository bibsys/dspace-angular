<ng-container *ngIf="listEntries$ | async">
  <div class="form-group w-100 pr-2 pl-2" *ngIf="(listEntries$ | async).length > searchLimit">
    <input type="search"
           class="form-control"
           (click)="$event.stopPropagation();"
           [attr.aria-label]="'dso-selector.placeholder' | translate: { type: typesString }"
           placeholder="{{'dso-selector.placeholder' | translate: { type: typesString } }}"
           [formControl]="input" ngbAutofocus (keyup.enter)="selectSingleResult()">
  </div>
</ng-container>
<div class="dropdown-divider"></div>
<div id="scrollable-menu-dso-selector-{{randomSeed}}" class="scrollable-menu list-group">
  <div
    infiniteScroll
    [infiniteScrollDistance]="1"
    [infiniteScrollThrottle]="0"
    [infiniteScrollContainer]="'#scrollable-menu-dso-selector-' + randomSeed"
    [fromRoot]="true"
    (scrolled)="onScrollDown()">
    <ng-container *ngIf="(listEntries$ | async) as listEntries">
      <button class="list-group-item list-group-item-action border-0 disabled" *ngIf="listEntries.length === 0">
        {{'dso-selector.no-results' | translate: { type: typesString } }}
      </button>
      <ng-container *ngFor="let listEntry of listEntries">
          <ng-container [ngSwitch]="isEnabled(listEntry) | async">
              <ng-container *ngSwitchCase="true" [ngTemplateOutlet]="enabledEntry" [ngTemplateOutletContext]="{entry: listEntry}"></ng-container>
              <ng-container *ngSwitchCase="false" [ngTemplateOutlet]="disabledEntry" [ngTemplateOutletContext]="{entry: listEntry}"></ng-container>
              <ng-container *ngSwitchDefault [ngTemplateOutlet]="loadingEntry"></ng-container>
          </ng-container>
      </ng-container>
    </ng-container>
    <button *ngIf="loading"
            class="list-group-item list-group-item-action border-0 list-entry">
      <ds-themed-loading [showMessage]="false"></ds-themed-loading>
    </button>
  </div>
</div>

<ng-template #loadingEntry>
    <ds-themed-loading [showMessage]="false"></ds-themed-loading>
</ng-template>

<ng-template #enabledEntry let-entry="entry">
    <button class="list-group-item list-group-item-action border-0 list-entry"
            [ngClass]="{'bg-primary': entry['id'] === currentDSOId}"
            title="{{ getName(entry) }}"
            dsHoverClass="ds-hover"
            (click)="showDisclaimer(entry) ? toggleDisclaimer(entry) : onClick(entry)"
            #listEntryElement>
        <div class="d-flex">
            <ds-listable-object-component-loader
                    [object]="entry"
                    [viewMode]="viewMode"
                    [linkType]=linkTypes.None
                    [context]="getContext(entry['id'])">
            </ds-listable-object-component-loader>
            <div class="ml-auto btn-success p-2 rounded d-flex align-items-center">
                <i class="fa fa-plus"></i>
                <span *ngIf="(isMobile$ | async) !== true" class="ml-2">{{ 'dso-selector.start-new-deposit' | translate }}</span>
            </div>
        </div>
    </button>
    <div *ngIf="activeDisclaimers.includes(getID(entry))" @slide class="alert alert-danger mx-2 my-1">
        <div class="mb-2" [innerHTML]="'dso-selector.disclaimer.content' | translate"></div>
        <div class="d-flex flex-row-reverse">
            <button class="btn btn-danger" (click)="onClick(entry)">{{ 'dso-selector.disclaimer.confirm' | translate }}</button>
        </div>
    </div>
</ng-template>

<ng-template #disabledEntry let-entry="entry">
    <button class="list-group-item list-group-item-action border-0 list-entry disabled-entry"
            title="{{ getName(entry) }}"
            [ngbTooltip]="'submission-button.add.disable-message' | translate"
            [tooltipClass]="'larger-tooltip'"
            #listEntryElement>
        <div class="d-flex">
            <ds-listable-object-component-loader
                    [object]="entry"
                    [viewMode]="viewMode"
                    [linkType]=linkTypes.None
                    [context]="getContext(entry['id'])">
            </ds-listable-object-component-loader>
            <div class="ml-auto btn-secondary disabled p-2 rounded d-flex align-items-center">
                <i class="fa fa-plus"></i>
                <span *ngIf="(isMobile$ | async) !== true" class="ml-2">{{ 'dso-selector.start-new-deposit' | translate }}</span>
            </div>
        </div>
    </button>
</ng-template>
