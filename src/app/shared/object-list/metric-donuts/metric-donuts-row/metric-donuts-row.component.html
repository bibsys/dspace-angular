<div *ngIf="(metrics$ | async).length" class="d-flex mt-3 flex-row gapx-2">
  <ng-container *ngFor="let metric of (metrics$ | async); trackBy: identify">
    <ds-metric-loader
      class="d-inline-block"
      [metric]="metric"
      [isListElement]="false"
      [hideLabel]="true"
    ></ds-metric-loader>
  </ng-container>
</div>
