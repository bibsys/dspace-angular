<button *ngIf="shouldShowButton$ | async"
   class="export-button btn btn-outline-primary"
   [ngbTooltip]="tooltipMsg | translate"
   (click)="export()"
   [title]="tooltipMsg |translate" [attr.aria-label]="tooltipMsg |translate">
    <i class="fas fa-file-csv fa-fw mr-1"></i>
    {{ 'item-export.form.btn.submit' | translate }}
</button>
