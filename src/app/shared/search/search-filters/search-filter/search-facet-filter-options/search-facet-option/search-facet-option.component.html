<a *ngIf="isVisible | async" class="d-flex flex-row align-items-start"
   [tabIndex]="-1"
   [routerLink]="[searchLink]"
   [queryParams]="addQueryParams" queryParamsHandling="merge">
  <label class="mb-0 d-flex w-100 align-items-center">
    <input type="checkbox" [checked]="false"/>
    <span class="px-2 break-facet small">
      {{ labelTranslation | dsCapitalize}}
    </span>
    <span class="small counter flex-grow-1 text-right text-primary">
        {{filterValue.count}}
    </span>
  </label>

</a>
