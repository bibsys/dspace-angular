<div class="d-flex">
  <ds-results-back-button *ngIf="showBackButton$ | async" [back]="back" />
  <ds-context-menu class="ml-auto"
                   [contextMenuObject]="object"
                   [contextMenuObjectType]="DspaceObjectType.ITEM" />
</div>

<div class="container my-3 p-0">
  <article>
    <!-- HEADER (Type + name) -->
    <div class="mb-5 d-flex">
      <div *ngIf="showThumbnails" class="mr-4">
        <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
          <ds-thumbnail [thumbnail]="object?.thumbnail | async"
                        [defaultImage]="'assets/images/person-placeholder.svg'"
                        [alt]="'thumbnail.person.alt'"
                        [placeholder]="'thumbnail.person.placeholder'">
          </ds-thumbnail>
        </ds-metadata-field-wrapper>
      </div>
      <div class="d-flex flex-column">
        <h3 class="text-muted m-0">{{ 'item.page.person.type' | translate }}</h3>
        <ds-item-page-title-field [item]="object" />
      </div>
    </div>
    <!-- MAIN METADATA SECTION -->
    <ds-page-detail-section [label]="'item.page.heading.person.details' | translate" class="mb-4">
      <dl class="ml-1">
        <ng-container *ngIf="object.hasMetadata('crisrp.name')">
          <dt>{{ "item.page.person.crisrp.name" | translate }}</dt>
          <dd>
            <ds-generic-item-page-field [item]="object" [fields]="['crisrp.name']"/>
          </dd>
        </ng-container>
        <ng-container *ngIf="object.hasMetadata('person.email')">
          <dt>{{ "item.page.person.email" | translate }}</dt>
          <dd>
            <ds-generic-item-page-field [item]="object" [fields]="['person.email']"/>
          </dd>
        </ng-container>
        <ng-container *ngIf="object.hasMetadata('person.identifier.orcid')">
          <dt>{{ "item.page.person.identifier.orcid" | translate }}</dt>
          <dd>
            <ds-orcid-short-format [orcid]="object.firstMetadataValue('person.identifier.orcid')"/>
          </dd>
        </ng-container>
        <ng-container *ngIf="object.hasMetadata('person.affiliation.institution')">
          <dt>{{ "item.page.affiliation" | translate }}</dt>
          <dd>
            <ds-item-page-affiliation-field [item]="object"
                                            [institutionField]="'person.affiliation.institution'"
                                            [departmentField]="'person.affiliation.department'"/>
          </dd>
        </ng-container>
        <ng-container *ngIf="object.hasMetadata('person.jobTitle')">
          <dt>{{ "item.page.person.jobTitle" | translate }}</dt>
          <dd>
            <ds-generic-item-page-field [item]="object" [fields]="['person.jobTitle']"/>
          </dd>
        </ng-container>
      </dl>
    </ds-page-detail-section>
    <!-- Display all publication of this author -->
    <ds-page-detail-section [label]="'item.page.heading.person.publications' | translate">
        <ds-tabbed-related-entities-search [item]="object"
                                           [relationTypes]="[{
                                              label: 'isAuthorOfPublication',
                                              filter: 'isAuthorOfPublication',
                                              configuration: 'default'
                                           }]">
        </ds-tabbed-related-entities-search>
    </ds-page-detail-section>
  </article>
</div>
