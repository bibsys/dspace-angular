<div class="d-inline-block">
  <div class="lead dont-break-out">{{ title }}</div>
  <div>
    <span *ngIf="uri">
      <a target="_blank" [href]="uri">
        <i class="fa-solid fa-identifier"></i>{{ uri }}
      </a>
    </span>
    <span *ngIf="identifiers?.length" data-test="identifiers" class="text-muted">
      <ds-truncatable [id]="object.id">
        <ds-truncatable-part [id]="object.id" [minLines]="1">
          <span *ngFor="let identifier of identifiers; let last=last">
            {{ identifier }}<span *ngIf="!last">; </span>
          </span>
        </ds-truncatable-part>
      </ds-truncatable>
    </span>
  </div>
  <div *ngIf="issued || contributors?.length" class="d-flex align-items-center text-muted">
    <span *ngIf="issued" class="item-list-date">({{ issued | date: 'YYYY-MM-dd' }})&nbsp;</span>
    <ds-truncatable *ngIf="contributors?.length" [id]="object.id">
      <ds-truncatable-part [id]="object.id" [minLines]="1">
        <span *ngFor="let contributor of contributors; let last=last;" class="item-list-authors">
          {{ contributor }}<span *ngIf="!last">; </span>
        </span>
      </ds-truncatable-part>
    </ds-truncatable>
  </div>
  <div *ngIf="abstract" class="item-list-abstract">
    <ds-truncatable [id]="object.id">
      <ds-truncatable-part [id]="object.id" [minLines]="3">
        <span>{{ abstract }}</span>
      </ds-truncatable-part>
    </ds-truncatable>
  </div>

  <div *ngIf="object?.matchObjects?.length > 0">
    <button type="button" class="btn btn-link p-0 mb-1" (click)="collapse.toggle()" [attr.aria-expanded]="!isCollapsed">
      <span class="badge badge-secondary">
        {{ object.matchObjects.length }}
      </span>
      {{ 'submission.sections.external-source.duplicate-matches.header' | translate }}
    </button>
    <ul #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed" [id]="object.id">
      <li *ngFor="let match of object.matchObjects">
        <a [routerLink]="getItemPageRoute(match)" target="_blank">{{ match.name }}</a>
      </li>
    </ul>
  </div>
</div>
